# The image of Authway Server for amd64 and arm64, on the GitHub Container Registry of this repository:
#   ghcr.io/phatdo1819/authway-server:0.3.1, :0.3 and :latest from a tag v0.3.1
# The tag must be the version of cmd/authway-server/main.go. Run by hand, it builds without publishing. The tests
# come first, from test.yml.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          source=$(sed -n 's/^var version = "\(.*\)"/\1/p' cmd/authway-server/main.go)
          if [ "v$source" != "$GITHUB_REF_NAME" ]; then
            echo "the tag $GITHUB_REF_NAME isn't the version of the source, $source" >&2
            exit 1
          fi
      # only the last stage of the image runs on the target: apk add
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/authway-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
