# The image of Authway Server for amd64 and arm64, on the GitHub Container Registry of this repository:
#   ghcr.io/phatdo1819/authway-server:0.1.0, :0.1 and :latest from a tag v0.1.0
# The tag must be the version of cmd/authway-server/main.go. Run by hand, it builds without publishing.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web UI
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Tests
        run: go vet ./... && go test ./...
      - name: Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          source=$(sed -n 's/^var version = "\(.*\)"/\1/p' cmd/authway-server/main.go)
          if [ "v$source" != "$GITHUB_REF_NAME" ]; then
            echo "the tag $GITHUB_REF_NAME isn't the version of the source, $source" >&2
            exit 1
          fi

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # only the last stage of the image runs on the target: apk add
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/authway-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
