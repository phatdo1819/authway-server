# The tests of Authway Server, for every push to main and every pull request. The image workflow runs them too,
# before it builds.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web UI
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Tests
        run: go vet ./... && go test ./...
